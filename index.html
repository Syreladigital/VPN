<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SyrelaTrust Audit — RGPD Pharmacie</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--bg-card:#161B22;--bg-card2:#1C2128;
  --accent:#4F8EF7;--accent-d:#3a7ae0;
  --txt:#E6EDF3;--txt-m:#8B949E;
  --border:#30363D;
  --red:#F85149;--orange:#E3A04F;--yellow:#D29922;--green:#3FB950;
  --r:8px}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
#app{min-height:100vh}

/* UTILITIES */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover:not(:disabled){background:var(--accent-d)}
.btn-ghost{background:transparent;color:var(--txt-m);border:1px solid var(--border)}.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--txt)}
.btn-danger{background:#2d1313;color:var(--red);border:1px solid #3d1a1a}.btn-danger:hover{background:#3d1a1a}

/* HEADER */
.app-header{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:56px;gap:12px}
.logo{font-size:17px;font-weight:700;color:var(--accent);letter-spacing:-.3px;flex-shrink:0;white-space:nowrap}
.logo span{color:var(--txt);font-weight:300}
.header-info{flex:1;min-width:0}
.header-pharmacy{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-sub{font-size:11px;color:var(--txt-m)}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.score-badge{padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;min-width:60px;text-align:center;cursor:default}
.score-critical{background:#2d1313;color:var(--red);border:1px solid #3d1a1a}
.score-warning{background:#2d1e0d;color:var(--orange);border:1px solid #3d2a0d}
.score-partial{background:#2d2810;color:var(--yellow);border:1px solid #3d3510}
.score-good{background:#0d2d15;color:var(--green);border:1px solid #0d3d18}
.timer{font-size:12px;color:var(--txt-m);font-variant-numeric:tabular-nums;font-family:monospace}

/* START SCREEN */
.start-wrap{max-width:560px;margin:0 auto;padding:48px 20px}
.brand-tag{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.start-title{font-size:30px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}
.start-sub{color:var(--txt-m);margin-bottom:32px;font-size:15px}
.form-group{margin-bottom:14px}
.form-label{display:block;margin-bottom:5px;color:var(--txt-m);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-select{width:100%;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--txt);font-size:14px;outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-select option{background:var(--bg-card)}
.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-opt{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;cursor:pointer;transition:border-color .15s;font-size:13px}
.radio-opt:has(input:checked){border-color:var(--accent);background:rgba(79,142,247,.08)}
.radio-opt input{accent-color:var(--accent);flex-shrink:0}
.session-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.session-item:hover{border-color:var(--accent)}

/* AUDIT LAYOUT */
.audit-wrap{display:flex;height:calc(100vh - 56px);overflow:hidden}
.audit-sidebar{width:210px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.sec-btn{width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:7px 10px;color:var(--txt-m);cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:4px;transition:all .15s;margin-bottom:1px}
.sec-btn:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.sec-btn.active{background:rgba(79,142,247,.12);color:var(--accent);font-weight:600}
.sec-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sec-prog{font-size:10.5px;color:var(--txt-m);flex-shrink:0}
.sec-btn.active .sec-prog{color:rgba(79,142,247,.7)}
.audit-main{flex:1;overflow-y:auto;padding:16px 20px}

/* PROGRESS */
.prog-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-m);margin-bottom:6px}
.prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#7ab3ff);transition:width .3s}

/* CONTROLS */
.audit-controls{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ctrl-title{font-weight:700;font-size:15px;flex:1;min-width:140px}
.toggle-grp{display:flex;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.tog-btn{padding:5px 12px;border:none;background:transparent;color:var(--txt-m);cursor:pointer;font-size:12px;transition:all .15s}
.tog-btn.active{background:var(--accent);color:#fff}
.filt-sel{background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--txt-m);font-size:12px;cursor:pointer;outline:none}
.filt-sel:focus{border-color:var(--accent)}

/* QUESTION CARD */
.q-card{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:border-color .15s}
.q-card.ans-conforme{border-left-color:var(--green)}
.q-card.ans-partiel{border-left-color:var(--yellow)}
.q-card.ans-non-conforme{border-left-color:var(--red)}
.q-card.ans-na{border-left-color:var(--txt-m);opacity:.65}
.q-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.q-id{font-size:10.5px;color:var(--txt-m);font-weight:700;font-family:monospace;flex-shrink:0;margin-top:2px}
.q-text{flex:1;font-size:13.5px;font-weight:500;line-height:1.45}
.rbadge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;flex-shrink:0}
.rb-critique{background:#2d1313;color:var(--red);border:1px solid #3d1a1a}
.rb-sensible{background:#2d1e0d;color:var(--orange);border:1px solid #3d2a0d}
.rb-acceptable{background:#0d2d15;color:var(--green);border:1px solid #0d3d18}
.q-ref{font-size:10.5px;color:var(--txt-m);margin-bottom:9px;padding-left:2px}
.ans-row{display:flex;gap:5px;flex-wrap:wrap}
.a-btn{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--txt-m);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.a-btn:hover{border-color:var(--accent);color:var(--txt)}
.a-btn.sel-conforme{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green)}
.a-btn.sel-partiel{background:rgba(210,153,34,.15);border-color:var(--yellow);color:var(--yellow)}
.a-btn.sel-non-conforme{background:rgba(248,81,73,.15);border-color:var(--red);color:var(--red)}
.a-btn.sel-na{background:rgba(139,148,158,.15);border-color:var(--txt-m);color:var(--txt-m)}
.q-note-area{width:100%;margin-top:8px;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--txt);font-size:12px;resize:vertical;min-height:50px;outline:none;font-family:inherit;transition:border-color .15s}
.q-note-area:focus{border-color:var(--accent)}

/* GUIDED */
.guided-wrap{max-width:640px;margin:0 auto}
.guided-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.guided-ctr{color:var(--txt-m);font-size:12px}

/* SUMMARY */
.sum-wrap{max-width:960px;margin:0 auto;padding:24px 20px}
.sum-title{font-size:22px;font-weight:800;margin-bottom:3px}
.sum-sub{color:var(--txt-m);margin-bottom:20px;font-size:13px}
.score-hero{text-align:center;padding:28px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px}
.score-num{font-size:72px;font-weight:800;line-height:1;letter-spacing:-3px}
.score-lbl{font-size:15px;color:var(--txt-m);margin-top:6px}
.gauge{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:14px auto 6px;max-width:400px}
.gauge-fill{height:100%;border-radius:5px;transition:width .5s}
.crit-block{background:var(--bg-card);border:1px solid rgba(248,81,73,.35);border-radius:var(--r);padding:16px;margin-bottom:20px}
.crit-head{color:var(--red);font-weight:700;margin-bottom:10px;font-size:14px}
.crit-row{padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.crit-row:last-child{border-bottom:none}
.crit-row-id{color:var(--red);font-weight:700;font-family:monospace;margin-right:6px}
.sum-table{width:100%;border-collapse:collapse;font-size:12.5px}
.sum-table th,.sum-table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
.sum-table th{background:var(--bg-card2);color:var(--txt-m);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.sum-table tbody tr:hover td{background:rgba(255,255,255,.02)}
.note-banner{background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12.5px;color:var(--txt-m);margin-top:12px;text-align:left}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:20px;max-width:500px;width:100%}

/* EMPTY STATE */
.empty{color:var(--txt-m);text-align:center;padding:40px 20px;font-size:13px}

/* RESPONSIVE */
@media(max-width:680px){
  .audit-sidebar{display:none}
  .audit-sidebar.mob-open{display:block;position:fixed;top:56px;left:0;right:0;bottom:0;z-index:50;overflow-y:auto;width:100%}
  .score-num{font-size:52px}
  .ans-row{gap:4px}
  .a-btn{padding:5px 8px;font-size:11px}
}
@media(min-width:681px){
  .btn-mob-menu{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';

// ─── DATA ─────────────────────────────────────────────────────────────────────

const SECTIONS = [
  {
    id:1, key:'LGO', title:'Logiciel métier LGO',
    questions:[
      {id:'LGO-1', text:'Comptes partagés / mot de passe générique pour le LGO ?', risk:'critique', ref:'Art. 32 RGPD', rec:'Créer des comptes nominatifs individuels dans le LGO. Supprimer les mots de passe génériques.'},
      {id:'LGO-2', text:'Préparateurs ont le même niveau d\'accès que le titulaire ?', risk:'sensible', ref:'Art. 5(1)f RGPD', rec:null},
      {id:'LGO-3', text:'Exports de données patients tracés et contrôlés ?', risk:'critique', ref:'Art. 32 RGPD', rec:'Activer la journalisation des exports dans le LGO. Restreindre les droits d\'export au seul titulaire.'},
      {id:'LGO-4', text:'Sauvegardes localisées et accès contrôlé ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'LGO-5', text:'Contrat Art. 28 signé avec l\'éditeur LGO ?', risk:'critique', ref:'Art. 28 RGPD', rec:'Signer un avenant RGPD Art. 28 avec l\'éditeur du LGO. Modèle disponible sur cnil.fr.'},
      {id:'LGO-6', text:'Remplaçants utilisent l\'identifiant du titulaire ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'LGO-7', text:'LGO hébergé chez un prestataire certifié HDS en Europe ?', risk:'critique', ref:'Décret 2026-209', rec:'Vérifier la certification HDS de l\'hébergeur du LGO. Demander attestation écrite à l\'éditeur.'},
      {id:'LGO-8', text:'Mise à jour régulière du LGO (correctifs sécurité) ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'LGO-9', text:'Accès distant au LGO sécurisé (VPN, double authentification) ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'LGO-10', text:'Historique des accès et connexions au LGO conservé ?', risk:'acceptable', ref:'Art. 32 RGPD', rec:null},
    ]
  },
  {
    id:2, key:'COM', title:'Communications',
    questions:[
      {id:'COM-1', text:'Ordonnances/données patients envoyées par Gmail/Outlook classique ?', risk:'critique', ref:'Art. 9 RGPD', rec:'Interdire l\'envoi d\'ordonnances par email classique. Adopter MSSanté ou Apicrypt.'},
      {id:'COM-2', text:'WhatsApp/SMS utilisés pour échanger des infos patients ?', risk:'critique', ref:'Art. 9 RGPD', rec:'Interdire WhatsApp et SMS pour les échanges patients. Formaliser par note interne.'},
      {id:'COM-3', text:'Téléphones personnels utilisés pour échanges professionnels ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'COM-4', text:'Boîte email personnelle utilisée pour communications pro ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'COM-5', text:'Messagerie sécurisée MSSanté / Apicrypt utilisée ?', risk:'acceptable', ref:'ANS MSSanté', rec:null},
      {id:'COM-6', text:'Fax encore utilisé pour envoi d\'ordonnances ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'COM-7', text:'Politique écrite sur les canaux de communication autorisés ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
    ]
  },
  {
    id:3, key:'EXT', title:'Relations externes / Sous-traitants',
    questions:[
      {id:'EXT-1', text:'Bulletins de salaire/RIB envoyés au comptable par email non sécurisé ?', risk:'sensible', ref:'Art. 28 RGPD', rec:null},
      {id:'EXT-2', text:'Mutuelles demandent copies de factures par fax/email ?', risk:'sensible', ref:'Art. 28 RGPD', rec:null},
      {id:'EXT-3', text:'Prestataires ménage/alarme ont accès aux zones avec données visibles ?', risk:'acceptable', ref:'Art. 32 RGPD', rec:null},
      {id:'EXT-4', text:'Liste à jour de tous les prestataires ayant accès aux données ?', risk:'critique', ref:'Art. 28 RGPD', rec:'Dresser la liste exhaustive des prestataires ayant accès aux données. Mettre à jour trimestriellement.'},
      {id:'EXT-5', text:'Contrats article 28 signés avec tous les prestataires clés ?', risk:'critique', ref:'Art. 28 RGPD', rec:'Signer des contrats Art. 28 avec chaque prestataire clé. Modèles disponibles sur cnil.fr.'},
      {id:'EXT-6', text:'Prestataires informatiques (maintenance) avec contrat Art. 28 ?', risk:'critique', ref:'Art. 28 RGPD', rec:'Régulariser le contrat Art. 28 avec le prestataire de maintenance informatique.'},
      {id:'EXT-7', text:'Transfert de données vers pays hors UE identifié et encadré ?', risk:'critique', ref:'Art. 44-49 RGPD', rec:'Identifier tout transfert hors UE. Mettre en place les garanties prévues aux Art. 44-49 RGPD.'},
      {id:'EXT-8', text:'OCT (organisme concentrateur tiers-payant) avec contrat Art. 28 ?', risk:'critique', ref:'Art. 28 RGPD', rec:'Signer un contrat Art. 28 avec l\'OCT tiers-payant.'},
      {id:'EXT-9', text:'Vérification que les sous-traitants sont eux-mêmes conformes RGPD ?', risk:'sensible', ref:'Art. 28(4) RGPD', rec:null},
    ]
  },
  {
    id:4, key:'RH', title:'RH & Salaires',
    questions:[
      {id:'RH-1', text:'Bulletins de salaire accessibles à tous les collaborateurs ?', risk:'sensible', ref:'Art. 5(1)f RGPD', rec:null},
      {id:'RH-2', text:'Dossiers salariés accessibles à plusieurs personnes sans justification ?', risk:'sensible', ref:'Art. 5(1)f RGPD', rec:null},
      {id:'RH-3', text:'Données RH envoyées au cabinet comptable via canal non sécurisé ?', risk:'sensible', ref:'Art. 28 RGPD', rec:null},
      {id:'RH-4', text:'Dossiers candidats non retenus conservés plus de 2 ans ?', risk:'acceptable', ref:'Art. 5(1)e RGPD', rec:null},
      {id:'RH-5', text:'Employés informés du traitement de leurs données personnelles ?', risk:'critique', ref:'Art. 13 RGPD', rec:'Remettre à chaque employé une notice d\'information sur le traitement de ses données.'},
      {id:'RH-6', text:'Vidéosurveillance — salariés informés, déclaration CNIL faite ?', risk:'critique', ref:'Art. 13 RGPD', rec:'Informer les salariés de la vidéosurveillance. Vérifier la conformité de l\'affichage obligatoire.'},
      {id:'RH-7', text:'Données de santé des salariés stockées séparément ?', risk:'critique', ref:'Art. 9 RGPD', rec:'Stocker les données de santé salariés dans un dossier séparé à accès restreint.'},
    ]
  },
  {
    id:5, key:'WEB', title:'Site web & présence digitale',
    questions:[
      {id:'WEB-1', text:'Site web avec formulaire de contact — politique de confidentialité affichée ?', risk:'critique', ref:'Art. 13 RGPD', rec:'Ajouter une politique de confidentialité conforme RGPD sur le site. Lier depuis chaque formulaire.'},
      {id:'WEB-2', text:'Cookies analytiques/marketing utilisés sans consentement explicite ?', risk:'critique', ref:'Directive ePrivacy', rec:'Installer un bandeau cookies conforme avec recueil de consentement préalable.'},
      {id:'WEB-3', text:'Prise de RDV en ligne — prestataire avec contrat Art. 28 ?', risk:'critique', ref:'Art. 28 RGPD', rec:'Signer un contrat Art. 28 avec la plateforme de prise de RDV en ligne.'},
      {id:'WEB-4', text:'Avis patients en ligne — données collectées avec base légale ?', risk:'sensible', ref:'Art. 6 RGPD', rec:null},
      {id:'WEB-5', text:'Hébergeur du site web localisé en Europe ?', risk:'sensible', ref:'Décret 2026-209', rec:null},
      {id:'WEB-6', text:'Formulaires de contact chiffrés (HTTPS) ?', risk:'sensible', ref:'Art. 32 RGPD', rec:null},
      {id:'WEB-7', text:'Boutique en ligne médicaments — conformité spécifique vente en ligne ?', risk:'critique', ref:'Art. 13 + CSP', rec:'Vérifier la conformité spécifique de la boutique en ligne aux obligations CSP et RGPD.'},
    ]
  },
  {
    id:6, key:'REG', title:'Registre des traitements',
    questions:[
      {id:'REG-1', text:'Registre des traitements existe et est à jour ?', risk:'critique', ref:'Art. 30 RGPD', rec:'Créer le registre des traitements. Modèle officine disponible sur le site de l\'Ordre des Pharmaciens.'},
      {id:'REG-2', text:'Toutes les finalités de traitement sont documentées ?', risk:'critique', ref:'Art. 30 RGPD', rec:'Documenter toutes les finalités de traitement dans le registre.'},
      {id:'REG-3', text:'Durées de conservation définies pour chaque traitement ?', risk:'critique', ref:'Art. 5(1)e RGPD', rec:'Définir et documenter les durées de conservation pour chaque catégorie de données.'},
      {id:'REG-4', text:'Bases légales identifiées pour chaque traitement ?', risk:'critique', ref:'Art. 6 + 9 RGPD', rec:'Identifier la base légale RGPD pour chaque traitement dans le registre.'},
      {id:'REG-5', text:'Registre accessible en cas de contrôle CNIL ?', risk:'critique', ref:'Art. 30(4) RGPD', rec:'Conserver le registre accessible et à jour. Il doit être présentable à la CNIL sous 72h.'},
      {id:'REG-6', text:'Transferts hors UE documentés dans le registre ?', risk:'sensible', ref:'Art. 30(1)e RGPD', rec:null},
    ]
  },
  {
    id:7, key:'DRT', title:'Droits des patients',
    questions:[
      {id:'DRT-1', text:'Affichage visible informant les patients de leurs droits ?', risk:'critique', ref:'Art. 13 RGPD', rec:'Afficher les mentions d\'information RGPD à l\'officine (comptoir et espace d\'attente).'},
      {id:'DRT-2', text:'Procédure écrite pour répondre à une demande d\'accès patient ?', risk:'critique', ref:'Art. 15 RGPD', rec:'Rédiger une procédure interne de traitement des demandes de droits patients.'},
      {id:'DRT-3', text:'Délai de réponse aux demandes de droits respecté (1 mois) ?', risk:'sensible', ref:'Art. 12(3) RGPD', rec:null},
      {id:'DRT-4', text:'Procédure de suppression / rectification des données patients ?', risk:'sensible', ref:'Art. 17-18 RGPD', rec:null},
      {id:'DRT-5', text:'Information patients lors des nouveaux actes (vaccination, TROD) ?', risk:'critique', ref:'Art. 13 RGPD', rec:'Mettre en place des mentions d\'information spécifiques pour vaccination, TROD, entretiens.'},
      {id:'DRT-6', text:'Conservation des preuves de consentement patients ?', risk:'sensible', ref:'Art. 7 RGPD', rec:null},
    ]
  },
  {
    id:8, key:'SEC', title:'Cybersécurité physique & organisationnelle',
    questions:[

const W = {
  critique:   {conforme:3,   partiel:1.5,  'non-conforme':0},
  sensible:   {conforme:1,   partiel:0.5,  'non-conforme':0},

};

// ─── STATE ────────────────────────────────────────────────────────────────────

let ST = {
  screen: 'start',
  pharmacy: null,
  answers: {},

// ─── HELPERS ──────────────────────────────────────────────────────────────────

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getSections(){
  return SECTIONS.filter(s => !s.conditionalCA || (ST.pharmacy && ST.pharmacy.ca === 'high'));
}

function storageKey(){
  if(!ST.pharmacy) return null;
  return 'syrelatrust_' + ST.pharmacy.name.replace(/\s+/g,'_') + '_' + ST.pharmacy.date;
}

function saveState(){
  const k = storageKey();
  if(!k) return;
  try{ localStorage.setItem(k, JSON.stringify({pharmacy:ST.pharmacy, answers:ST.answers, globalNote:ST.globalNote, sessionStart:ST.sessionStart, savedAt:Date.now()})); }catch(e){}
}

function listSessions(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.startsWith('syrelatrust_')){
      try{const d=JSON.parse(localStorage.getItem(k)); if(d&&d.pharmacy) out.push({key:k,data:d});}catch(e){}
    }
  }
  return out.sort((a,b)=>(b.data.savedAt||0)-(a.data.savedAt||0));
}

function loadSession(key){
  try{
    const d=JSON.parse(localStorage.getItem(key));
    if(d){ ST.pharmacy=d.pharmacy; ST.answers=d.answers||{}; ST.globalNote=d.globalNote||''; ST.sessionStart=d.sessionStart||Date.now(); return true; }
  }catch(e){}
  return false;
}

// ─── SCORE ────────────────────────────────────────────────────────────────────

function calcScore(answers, sections){
  let earned=0, max=0;
  (sections||getSections()).forEach(s=>s.questions.forEach(q=>{
    const a=(answers||ST.answers)[q.id];
    if(!a||!a.answer||a.answer==='na') return;
    max += W[q.risk].conforme;
    earned += (W[q.risk][a.answer]||0);
  }));
  return max===0 ? null : Math.round((earned/max)*100);
}

function calcSecScore(s){
  let earned=0,max=0,conf=0,part=0,nc=0,na=0;
  s.questions.forEach(q=>{
    const a=ST.answers[q.id];
    if(!a||!a.answer) return;
    if(a.answer==='na'){na++;return;}
    max+=W[q.risk].conforme; earned+=(W[q.risk][a.answer]||0);
    if(a.answer==='conforme') conf++;
    else if(a.answer==='partiel') part++;
    else nc++;
  });
  return {conf,part,nc,na,answered:conf+part+nc,total:s.questions.length,score:max>0?Math.round((earned/max)*100):null};
}

function scoreQual(pct){
  if(pct===null) return {label:'N/A',cls:''};
  if(pct<=40)  return {label:'Exposition critique',cls:'score-critical'};
  if(pct<=65)  return {label:'Améliorations urgentes',cls:'score-warning'};
  if(pct<=85)  return {label:'Conformité partielle',cls:'score-partial'};
  return {label:'Bonne conformité',cls:'score-good'};
}

function scoreColor(pct){
  if(pct===null) return '#8B949E';
  if(pct<=40) return '#F85149';
  if(pct<=65) return '#E3A04F';
  if(pct<=85) return '#D29922';
  return '#3FB950';
}

function countAnswered(){
  const secs=getSections(); let total=0,answered=0;
  secs.forEach(s=>s.questions.forEach(q=>{ total++; if(ST.answers[q.id]&&ST.answers[q.id].answer) answered++; }));
  return {total,answered};
}

// ─── TIMER ────────────────────────────────────────────────────────────────────

function fmtTimer(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return h+'h'+String(m).padStart(2,'0')+'m';
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function startTimer(){
  if(ST.timerInterval) clearInterval(ST.timerInterval);
  ST.timerInterval=setInterval(()=>{
    const el=document.getElementById('timer-disp');
    if(el&&ST.sessionStart) el.textContent=fmtTimer(Date.now()-ST.sessionStart);
  },1000);
}

function rBadge(risk){
  const m={critique:'🔴 Critique',sensible:'🟠 Sensible',acceptable:'🟡 Acceptable'};
  return `<span class="rbadge rb-${risk}">${m[risk]||risk}</span>`;
}

function aClass(qid,ans){
  const a=ST.answers[qid];

  return ' sel-'+ans;

function qCardCls(qid){
  const a=ST.answers[qid];

  return 'q-card ans-'+a.answer;
}

function renderQCard(q){

    <button class="btn btn-primary" style="padding:10px 20px" onclick="generatePDF()">📄 Générer le rapport PDF</button>
    <button class="btn btn-ghost" onclick="showScreen('audit')">← Retour à l'audit</button>
    <button class="btn btn-danger" onclick="newSession()">🗑 Nouvelle session</button>
  </div>
</div>`;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────

function setAns(qid, ans){
  if(!ST.answers[qid]) ST.answers[qid]={};
  ST.answers[qid].answer=ans;
  saveState();
  // Patch card without full re-render
  const card=document.getElementById('qc-'+qid);
  if(card){
    card.className='q-card ans-'+ans;
    card.querySelectorAll('.a-btn').forEach(b=>b.className='a-btn');
    const idx={'conforme':0,'partiel':1,'non-conforme':2,'na':3}[ans];
    if(idx!==undefined){
      const btns=card.querySelectorAll('.a-btn');
      if(btns[idx]) btns[idx].className='a-btn sel-'+ans;
    }
  }
  updateScoreBadge();
  updateProgress();
  updateSidebarProgress();
}

function setNote(qid, val){
  if(!ST.answers[qid]) ST.answers[qid]={};
  ST.answers[qid].note=val;
  saveState();
}

function updateScoreBadge(){
  const score=calcScore();
  const q=scoreQual(score);
  const el=document.getElementById('score-badge');
  if(el){ el.className='score-badge '+q.cls; el.textContent=score!==null?score+'%':'—'; el.title=q.label; }
}

function updateProgress(){
  const {total,answered}=countAnswered();
  const pct=total>0?Math.round(answered/total*100):0;
  const f=document.getElementById('prog-fill'); if(f) f.style.width=pct+'%';
  const t=document.getElementById('prog-txt'); if(t) t.textContent=answered+'/'+total+' questions répondues';
  const p=document.getElementById('prog-pct'); if(p) p.textContent=pct+'%';
}

function updateSidebarProgress(){
  getSections().forEach(s=>{
    const el=document.getElementById('sp-'+s.id);
    if(!el) return;
    const ans=s.questions.filter(q=>ST.answers[q.id]&&ST.answers[q.id].answer).length;
    el.textContent=ans+'/'+s.questions.length;
    el.style.color=ans===s.questions.length?'var(--green)':'';
  });
}

function selSec(idx){
  ST.curSection=idx; ST.guidedQ=0;
  renderApp();
}

function setMode(m){ ST.mode=m; renderApp(); }
function setFilter(v){ ST.filter=v; renderApp(); }

function guidedNext(){
  const secs=getSections(), sec=secs[ST.curSection];
  if(ST.guidedQ<sec.questions.length-1){ ST.guidedQ++; renderApp(); }
}
function guidedPrev(){
  if(ST.guidedQ>0){ ST.guidedQ--; renderApp(); }
}

function openGlobalNote(){
  const overlay=document.createElement('div');
  overlay.id='modal-ov';
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal-box">
  <div style="font-weight:700;margin-bottom:10px;font-size:15px">📝 Note globale sur la pharmacie</div>
  <textarea id="gn-inp" style="width:100%;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--txt);font-size:13px;min-height:100px;outline:none;resize:vertical;font-family:inherit" placeholder="Observations générales, contexte, remarques...">${esc(ST.globalNote)}</textarea>
  <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
    <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="saveGN()">Enregistrer</button>
  </div>
</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('gn-inp').focus(),50);
}

function saveGN(){
  const el=document.getElementById('gn-inp');
  if(el){ ST.globalNote=el.value; saveState(); }
  closeModal();
}

function closeModal(){
  const m=document.getElementById('modal-ov');
  if(m) m.remove();
}

function startAudit(){
  const name=(document.getElementById('f-name').value||'').trim();
  const tit=(document.getElementById('f-tit').value||'').trim();
  const date=(document.getElementById('f-date').value||'').trim();
  const ca=document.querySelector('input[name="ca"]:checked')?.value||'low';
  const addr=(document.getElementById('f-addr').value||'').trim();
  if(!name||!tit||!date){ alert('Veuillez remplir les champs obligatoires.'); return; }
  ST.pharmacy={name,titulaire:tit,date,ca,address:addr};
  ST.answers={}; ST.globalNote=''; ST.sessionStart=Date.now();
  ST.curSection=0; ST.mode='list'; ST.filter='all'; ST.guidedQ=0;
  saveState();
  showScreen('audit');
}

function resumeSess(key){
  if(loadSession(key)){ ST.curSection=0; ST.mode='list'; ST.filter='all'; ST.guidedQ=0; showScreen('audit'); }
}

function delSess(key){
  if(confirm('Supprimer cette session ?')){ localStorage.removeItem(key); renderApp(); }
}

function newSession(){
  if(confirm('Démarrer une nouvelle session ? La session actuelle reste sauvegardée.')) showScreen('start');
}

// ─── PDF GENERATION ───────────────────────────────────────────────────────────

function generatePDF(){
  if(!window.jspdf){ alert('jsPDF non disponible. Vérifiez votre connexion internet.'); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});

  const PW=210, PH=297, M=14, CW=PW-2*M;
  let y=M;

  const secs=getSections();
  const score=calcScore();
  const qual=scoreQual(score);
  const {total,answered}=countAnswered();
  const sc=scoreColor(score);

  const critNCs=[];
  secs.forEach(s=>s.questions.forEach(q=>{
    const a=ST.answers[q.id];
    if(q.risk==='critique'&&a&&a.answer==='non-conforme') critNCs.push({...q,note:a.note||'',secTitle:s.title});
  }));

  function rgb(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
  const scRGB=rgb(sc);

  function footer(){
    const pg=doc.internal.getCurrentPageInfo().pageNumber;
    doc.setFontSize(7.5); doc.setTextColor(110,120,130); doc.setFont('helvetica','normal');
    doc.line(M,PH-14,PW-M,PH-14);
    doc.setDrawColor(50,60,70);
    doc.text('Rapport confidentiel — Syrela Digital — Dr Walid Ben Slimane — contact@syreladigital.fr — www.syreladigital.fr — +33 7 49 49 38 54', M, PH-10, {maxWidth:CW-20});
    doc.text('Page '+pg, PW-M, PH-10, {align:'right'});
  }

  function addPage(){ doc.addPage(); y=M+4; footer(); }
  function chkY(n){ if(y+n>PH-18) addPage(); }

  // ── PAGE 1: COVER ──────────────────────────────────────────────────────────
  footer();

  // Header band
  doc.setFillColor(79,142,247);
  doc.rect(0,0,PW,24,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(255,255,255);
  doc.text('SyrelaTrust',M,15);
  doc.setFont('helvetica','normal');
  doc.text(' Audit',M+39,15);
  doc.setFontSize(10);
  doc.text('Rapport d\'Audit RGPD — Pharmacie d\'Officine',M,21);

  y=32;

  // Info card
  doc.setFillColor(22,27,34); doc.setDrawColor(48,54,61);
  doc.roundedRect(M,y,CW,32,2,2,'F');
  doc.roundedRect(M,y,CW,32,2,2,'S');

  doc.setFontSize(7.5); doc.setTextColor(120,130,140); doc.setFont('helvetica','normal');
  doc.text('PHARMACIE',M+5,y+7); doc.text('TITULAIRE',M+CW/2+5,y+7);
  doc.setFontSize(11); doc.setTextColor(230,237,243); doc.setFont('helvetica','bold');
  doc.text(ST.pharmacy.name||'',M+5,y+14); doc.text(ST.pharmacy.titulaire||'',M+CW/2+5,y+14);
  doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(120,130,140);
  if(ST.pharmacy.address) doc.text(ST.pharmacy.address,M+5,y+21,{maxWidth:CW/2-8});
  doc.text('Date : '+ST.pharmacy.date,M+CW/2+5,y+21);
  doc.text('CA : '+(ST.pharmacy.ca==='high'?'> 2,6M€':'< 2,6M€'),M+CW/2+5,y+27);
  doc.text('Questions : '+answered+'/'+total,M+5,y+27);

  y+=38;

  // Score box
  doc.setFillColor(...scRGB);
  doc.roundedRect(M,y,45,24,2,2,'F');
  doc.setFontSize(24); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold');
  doc.text(score!==null?score+'%':'N/A',M+22.5,y+13,{align:'center'});
  doc.setFontSize(7); doc.text(qual.label,M+22.5,y+19,{align:'center'});

  // Gauge bar
  const gaugeX=M+48, gaugeW=CW-48, gaugeY=y+9;
  doc.setFillColor(40,50,60); doc.roundedRect(gaugeX,gaugeY,gaugeW,7,2,2,'F');
  if(score&&score>0){
    doc.setFillColor(...scRGB);
    doc.roundedRect(gaugeX,gaugeY,gaugeW*score/100,7,2,2,'F');
  }
  doc.setFontSize(8); doc.setTextColor(120,130,140); doc.setFont('helvetica','normal');
  doc.text(critNCs.length+' non-conformité'+(critNCs.length!==1?'s':'')+' critique'+(critNCs.length!==1?'s':''),gaugeX,y+22);

  y+=30;

  if(ST.globalNote){
    chkY(12);
    doc.setFontSize(8); doc.setTextColor(120,130,140); doc.setFont('helvetica','italic');
    const nl=doc.splitTextToSize('Note : '+ST.globalNote,CW);
    doc.text(nl,M,y); y+=nl.length*3.8+4;
  }

  // ── PAGE 2: SECTION TABLE ──────────────────────────────────────────────────
  addPage();

  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(79,142,247);
  doc.text('Synthèse par section',M,y); y+=8;

  const cols=[
    {label:'Section',x:M,w:62},
    {label:'Total',x:M+64,w:13},
    {label:'Conformes',x:M+79,w:21},
    {label:'Partiels',x:M+102,w:19},
    {label:'Non conf.',x:M+123,w:22},
    {label:'N/A',x:M+147,w:13},
    {label:'Score',x:M+162,w:20},
  ];
  const rH=7;

  doc.setFillColor(28,33,40);
  doc.rect(M,y,CW,rH,'F');
  doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(120,130,140);
  cols.forEach(c=>doc.text(c.label,c.x+1,y+5));
  y+=rH;

  secs.forEach((s,i)=>{
    chkY(rH+2);
    const st=calcSecScore(s);
    if(i%2===0){ doc.setFillColor(22,27,34); doc.rect(M,y,CW,rH,'F'); }
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(220,228,236);
    doc.text(s.title,cols[0].x+1,y+5,{maxWidth:cols[0].w-2});
    doc.text(String(s.questions.length),cols[1].x+1,y+5);
    doc.setTextColor(63,185,80); doc.text(String(st.conf),cols[2].x+1,y+5);
    doc.setTextColor(210,153,34); doc.text(String(st.part),cols[3].x+1,y+5);
    doc.setTextColor(248,81,73); doc.text(String(st.nc),cols[4].x+1,y+5);
    doc.setTextColor(120,130,140); doc.text(String(st.na),cols[5].x+1,y+5);
    doc.setFont('helvetica','bold'); doc.setTextColor(220,228,236);
    doc.text(st.score!==null?st.score+'%':'N/A',cols[6].x+1,y+5);
    doc.setDrawColor(40,50,60); doc.line(M,y+rH,M+CW,y+rH);
    y+=rH;
  });

  // ── PAGES 3+: DETAIL BY SECTION ───────────────────────────────────────────
  secs.forEach(sec=>{
    const answered2=sec.questions.filter(q=>ST.answers[q.id]&&ST.answers[q.id].answer);
    if(!answered2.length) return;

    addPage();

    doc.setFillColor(22,27,34);
    doc.rect(M,y-2,CW,13,'F');
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(79,142,247);
    doc.text(sec.title,M+4,y+6);
    y+=16;

    sec.questions.forEach(q=>{
      const a=ST.answers[q.id];
      if(!a||!a.answer) return;

      const noteLines=a.note ? doc.splitTextToSize('Note : '+a.note, CW-10) : [];
      const qLines=doc.splitTextToSize(q.text, CW-50);
      const bH=3+qLines.length*3.8+4+(noteLines.length ? noteLines.length*3.5+2 : 0);

      chkY(bH+3);

      const bgColor=a.answer==='conforme'?[13,40,18]:a.answer==='partiel'?[40,35,10]:a.answer==='non-conforme'?[40,15,15]:[22,27,34];
      const barColor=a.answer==='conforme'?[63,185,80]:a.answer==='partiel'?[210,153,34]:a.answer==='non-conforme'?[248,81,73]:[100,110,120];

      doc.setFillColor(...bgColor); doc.rect(M,y,CW,bH,'F');
      doc.setFillColor(...barColor); doc.rect(M,y,2.5,bH,'F');

      // ID
      doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(120,130,140);
      doc.text(q.id,M+5,y+5);

      // Risk label right-aligned
      const rLabel=q.risk==='critique'?'Critique':q.risk==='sensible'?'Sensible':'Acceptable';
      const rColor=q.risk==='critique'?[248,81,73]:q.risk==='sensible'?[227,160,79]:[63,185,80];
      doc.setTextColor(...rColor); doc.text(rLabel,M+CW-2,y+5,{align:'right'});

      // Answer
      const aLabel=a.answer==='conforme'?'✓ Conforme':a.answer==='partiel'?'~ Partiel':a.answer==='non-conforme'?'✗ Non conf.':'N/A';
      doc.setTextColor(...barColor);
      const aLW=doc.getTextWidth(aLabel)+doc.getTextWidth(rLabel)+6;
      doc.text(aLabel,M+CW-2-doc.getTextWidth(rLabel)-5,y+5,{align:'right'});

      // Question text
      doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(220,228,236);
      doc.text(qLines,M+5,y+10);

      // Ref
      const refY=y+10+qLines.length*3.8;
      doc.setFontSize(7); doc.setTextColor(90,100,110);
      doc.text(q.ref,M+5,refY);

      // Note
      if(noteLines.length){
        doc.setFontSize(7.5); doc.setFont('helvetica','italic'); doc.setTextColor(160,170,180);
        doc.text(noteLines,M+5,refY+4);
      }

      y+=bH+2.5;
    });
  });

  // ── LAST PAGE: RECOMMENDATIONS ─────────────────────────────────────────────
  if(critNCs.length){
    addPage();
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(248,81,73);
    doc.text('Recommandations prioritaires',M,y); y+=5;
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(120,130,140);
    doc.text('Actions à mettre en œuvre pour les non-conformités critiques',M,y); y+=8;

    critNCs.forEach((q,i)=>{
      const recText=q.rec||'Mettre en conformité ce point avec les exigences RGPD.';
      const recLines=doc.splitTextToSize('→ '+recText,CW-22);
      const qLines2=doc.splitTextToSize(q.text,CW-22);
      const bH=6+qLines2.length*3.8+recLines.length*3.8+4;

      chkY(bH+4);

      doc.setFillColor(30,15,15); doc.setDrawColor(70,25,25);
      doc.roundedRect(M,y,CW,bH,2,2,'F');
      doc.roundedRect(M,y,CW,bH,2,2,'S');

      // Number circle
      doc.setFillColor(248,81,73);
      doc.circle(M+7,y+7,5,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(255,255,255);
      doc.text(String(i+1),M+7,y+9.5,{align:'center'});

      // ID
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(248,81,73);
      doc.text(q.id,M+15,y+6);

      // Ref right
      doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(120,130,140);
      doc.text(q.ref,M+CW-2,y+6,{align:'right'});

      // Question
      doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(220,228,236);
      doc.text(qLines2,M+15,y+11);

      // Recommendation
      const recY=y+11+qLines2.length*3.8+1;
      doc.setFontSize(8); doc.setFont('helvetica','italic'); doc.setTextColor(190,170,170);
      doc.text(recLines,M+15,recY);

      y+=bH+4;
    });
  }

  const fname='SyrelaTrust_Audit_'+(ST.pharmacy.name||'').replace(/\s+/g,'_')+'_'+ST.pharmacy.date+'.pdf';
  doc.save(fname);
}

// ─── SCREEN MANAGEMENT ────────────────────────────────────────────────────────

function showScreen(name){
  ST.screen=name;
  renderApp();
  if(name==='audit'||name==='summary') startTimer();
  window.scrollTo(0,0);
}

function renderApp(){
  const app=document.getElementById('app');
  if(!app) return;
  if(ST.screen==='start') app.innerHTML=renderStart();
  else if(ST.screen==='audit') app.innerHTML=renderAudit();
  else if(ST.screen==='summary') app.innerHTML=renderSummary();
  if(ST.screen==='audit'||ST.screen==='summary') startTimer();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

renderApp();
</script>
</body>
</html>
